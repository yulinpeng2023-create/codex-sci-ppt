name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Environment doctor
        run: python plugins/codex-sci-ppt/skills/codex-sci-ppt/scripts/doctor.py
      - name: End-to-end self-test
        run: python plugins/codex-sci-ppt/skills/codex-sci-ppt/scripts/selftest.py
      - name: Reference scene regression
        run: python plugins/codex-sci-ppt/skills/codex-sci-ppt/scripts/reference_scene_selftest.py
      - name: Reference analyzer regression
        run: python plugins/codex-sci-ppt/skills/codex-sci-ppt/scripts/test_reference_analyzer.py
      - name: Bamboo template regression
        run: python plugins/codex-sci-ppt/skills/codex-sci-ppt/scripts/bamboo_template_selftest.py
      - name: Bamboo board regression
        run: python plugins/codex-sci-ppt/skills/codex-sci-ppt/scripts/bamboo_board_selftest.py
